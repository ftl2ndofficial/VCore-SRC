plugins {
    id 'fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:' + project.minecraft_version
    mappings 'net.fabricmc:yarn:' + project.yarn_mappings + ':v2'
    modImplementation 'net.fabricmc:fabric-loader:' + project.loader_version

    // Fabric API
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.100.1+1.21'

    // MixinExtras
    modImplementation 'io.github.llamalad7:mixinextras-fabric:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.5.0'
}

loom {
    accessWidenerPath = file('src/main/resources/Vcore.accesswidener')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    exclude 'baritone/**'
}
